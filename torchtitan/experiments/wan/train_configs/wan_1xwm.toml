[job]
dump_folder = "./outputs/wan2.2-5B_bs128_fp8_compile"
description = "Wan 2.2-5B trained with 1x-wmds dataset"
custom_config_module = "torchtitan.experiments.wan.job_config"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = true

[model]
name = "wan"
flavor = "wan-video"
converters = ["quantize.linear.float8"]

[optimizer]
name = "AdamW"
lr = 1e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 500  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.0  # no decay


[training]
loss_reduction = "mean"
local_batch_size = 128
max_norm = 1.0  # grad norm clipping
steps = 10_000
dataset = "1xwm"
dataset_path = "./dataset/world_model_raw_data/train_v2.0_raw"
downsampled = 4  # Downsampling factor: 1, 2, or 4
clip_length = 77  # Number of frames per clip
window_size = 4  # Window size for sampling clips
robot_temporal_mode = "downsample"  # How to handle robot state temporal alignment
num_workers = 8  # Number of worker processes for data loading (0 = main process only)
persistent_workers = true  # Keep workers alive across epochs (requires num_workers > 0)
pin_memory = true  # Pin memory for faster GPU transfer (recommended when using GPU)
prefetch_factor = 1  # Number of batches each worker prefetches ahead (default: 2, higher = more memory)
dtype = "bfloat16"

[encoder]
t5_encoder = "google/umt5-xxl"
max_t5_encoding_len = 512# 256
wan_vae_path = "assets/hf/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[activation_checkpoint]
mode = "full"

[compile]
enable = true  # Enable torch.compile for VAE and model
components = ["model"] # ["vae", "model"]  # Compile both VAE and diffusion model
backend = "inductor"

[quantize.linear.float8]
enable_fsdp_float8_all_gather = true
precompute_float8_dynamic_scale_for_fsdp = true

[checkpoint]
enable = true
folder = "checkpoint"
interval = 100
last_save_model_only = true
export_dtype = "float32"
async_mode = "async"  # ["disabled", "async", "async_with_pinned_mem"]

[validation]
enable = true
dataset = "1xwm"  # Can use same dataset for validation
dataset_path = "./dataset/world_model_raw_data/val_v2.0_raw"  # Validation dataset path
local_batch_size = 16
steps = 8    # Recommended value with the current settings and world_size=8
freq = 100
enable_classifier_free_guidance = false
classifier_free_guidance_scale = 1.0
denoising_steps = 50
save_img_count = 50
save_img_folder = "videos"
all_timesteps = false
